# Render Blueprint for the FastAPI backend (Docker, free plan). Secrets use sync:false: set them in the
# Render dashboard; never commit values. Env names match apps/api/app/core/config.py (see apps/api/env.example).
# APP_ENV starts as "staging" so the service boots before Sentry/Supabase exist (fake data only!).
# Flip to "production" once SENTRY_DSN, STORAGE_BACKEND=supabase, SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are set;
# production refuses to start without them.
services:
  - type: web
    name: clinic-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_CONNECT_TIMEOUT
        value: "10"
      - key: RUN_MIGRATIONS_ON_START
        value: "false"
      - key: DATABASE_URL            # healthcare_runtime via Neon POOLED host: postgresql+psycopg://...-pooler.../db?sslmode=require
        sync: false
      - key: DATABASE_MIGRATION_URL  # schema OWNER via Neon DIRECT host
        sync: false
      - key: SESSION_HMAC_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEYS
        sync: false
      - key: COOKIE_DOMAIN           # frontend host only, e.g. your-app.vercel.app
        sync: false
      - key: CSRF_ALLOWED_ORIGINS    # https://your-app.vercel.app (comma-separated for several)
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL          # https://your-app.vercel.app
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI     # https://<frontend>/api/v1/auth/google/callback
        sync: false
