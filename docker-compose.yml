# Self-hosted stack: Postgres 16 + owner-run migrations + the API as the least-privilege role.
#   infra/docker/up.sh            local stack on http://127.0.0.1:8000
#   infra/docker/up.sh --public   also opens a free Cloudflare quick tunnel (https URL for the Vercel frontend)
# The FIELD_ENCRYPTION_KEYS fallback is a DEV-ONLY key so a plain "docker compose up" works; init-env.sh generates a unique one.
# Values come from docker.env (git-ignored; created by infra/docker/init-env.sh). Without it, safe local defaults apply.
name: clinic
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthcare
      POSTGRES_USER: healthcare_migrator
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-healthcare_migrator_dev}
      HEALTHCARE_RUNTIME_PASSWORD: ${HEALTHCARE_RUNTIME_PASSWORD:-healthcare_runtime_dev}
    # no published port: only the migrate/api containers reach the database over the compose network
    # (to inspect it from the host: docker compose exec db psql -U healthcare_migrator healthcare)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare_migrator -d healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://healthcare_runtime:${HEALTHCARE_RUNTIME_PASSWORD:-healthcare_runtime_dev}@db:5432/healthcare
      DATABASE_MIGRATION_URL: postgresql+psycopg://healthcare_migrator:${POSTGRES_OWNER_PASSWORD:-healthcare_migrator_dev}@db:5432/healthcare
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY:-local-development-session-hmac-key-change-me}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:-l9E3deCfohbclkEMS8_mxCcgi-71x5H_f1f8sOmr1Jo=}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]          # reach it publicly only through the tunnel profile
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://healthcare_runtime:${HEALTHCARE_RUNTIME_PASSWORD:-healthcare_runtime_dev}@db:5432/healthcare
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY:-local-development-session-hmac-key-change-me}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:-l9E3deCfohbclkEMS8_mxCcgi-71x5H_f1f8sOmr1Jo=}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Trust forwarded headers only from peers on the compose network (the tunnel),
      # never "*", so a direct client cannot spoof X-Forwarded-For. The default is
      # the fixed subnet defined under `networks` below; override for other proxies.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.31.7.0/24}
      CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS:-http://localhost:3000,https://web-eight-flax-pmiw08soee.vercel.app,https://web-beta-wheat-56.vercel.app}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://web-eight-flax-pmiw08soee.vercel.app,https://web-beta-wheat-56.vercel.app}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - privatedata:/tmp/healthcare-private
      - publicdata:/tmp/healthcare-public
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: ./apps/api
    command: ["python", "scripts/scan_worker.py"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://healthcare_runtime:${HEALTHCARE_RUNTIME_PASSWORD:-healthcare_runtime_dev}@db:5432/healthcare
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:-l9E3deCfohbclkEMS8_mxCcgi-71x5H_f1f8sOmr1Jo=}
    volumes:
      - privatedata:/tmp/healthcare-private
      - publicdata:/tmp/healthcare-public
    depends_on:
      migrate:
        condition: service_completed_successfully

  tunnel:
    profiles: ["public"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy

  # Stable alternative to the ephemeral cloudflared quick tunnel: ngrok with a
  # reserved (free) static domain. The URL NEVER changes, so Vercel's API_URL is
  # set once and the site never breaks on restart/revocation.
  #   1. Free signup at https://ngrok.com → copy your authtoken.
  #   2. Claim your free static domain (Dashboard → Domains) e.g. foo.ngrok-free.app
  #   3. Put NGROK_AUTHTOKEN and NGROK_DOMAIN in docker.env
  #   4. Run:  docker compose --profile ngrok up -d tunnel-ngrok
  #   5. Set Vercel API_URL=https://<NGROK_DOMAIN> once, redeploy. Done forever.
  tunnel-ngrok:
    profiles: ["ngrok"]
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["http", "--url=https://${NGROK_DOMAIN}", "api:8000"]
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  privatedata:
  publicdata:

# Pin the compose network to a known subnet so FORWARDED_ALLOW_IPS can name it
# explicitly: the API then trusts forwarded headers only from containers on this
# network (the Cloudflare tunnel), not from any client that reaches it directly.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.7.0/24
