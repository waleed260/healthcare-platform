# Production-like local stack: real Postgres 16, owner-run migrations, app on the least-privilege role.
#   docker compose up -d --build        # builds, migrates, starts the API on :8000
#   curl -fsS http://localhost:8000/health/ready
# For hot-reload development use infra/docker/compose.yml instead.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthcare
      POSTGRES_USER: healthcare_migrator
      POSTGRES_PASSWORD: healthcare_migrator_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro   # creates healthcare_runtime BEFORE migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare_migrator -d healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://healthcare_runtime:healthcare_runtime_dev@db:5432/healthcare
      DATABASE_MIGRATION_URL: postgresql+psycopg://healthcare_migrator:healthcare_migrator_dev@db:5432/healthcare
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    ports: ["8000:8000"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://healthcare_runtime:healthcare_runtime_dev@db:5432/healthcare
      CSRF_ALLOWED_ORIGINS: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
